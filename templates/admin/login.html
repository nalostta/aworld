<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AWorld Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1f2937 0%, #0f172a 45%, #020617 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/95 rounded-2xl shadow-2xl w-full max-w-md p-10 border border-slate-100">
        <div class="text-center mb-8">
            <div class="text-3xl font-semibold text-slate-900">AWorld Admin</div>
            <p class="text-slate-500 mt-2">Sign in with your admin token to continue.</p>
        </div>

        {% if error %}
        <div class="mb-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2" for="token">
                    Admin Token
                </label>
                <input
                    class="block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                    type="password"
                    name="token"
                    id="token"
                    required
                    autocomplete="off"
                    placeholder="Enter secure token"
                />
            </div>
            <button
                type="submit"
                class="w-full inline-flex justify-center rounded-xl border border-transparent bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
                Sign In
            </button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-8">Access restricted to authorized operators only.</p>
    </div>
</body>
</html>
